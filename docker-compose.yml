# Déploiement Coolify sur Isadora (infra MINITEL — Authentik OBLIGATOIRE)
# - Aucun port publié sur l'hôte (routage HTTP via Traefik coolify-proxy:80)
# - Aucun accès docker.sock, aucun privilège, pas de réseau hôte
# - Plafonds RAM/CPU conformes aux règles §9.1
services:
  pixel-war:
    build: .
    restart: unless-stopped
    expose:
      - "3000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    environment:
      PORT: "3000"
      TRUST_PROXY: "true"
      DATA_DIR: "/data"
      EVENT_TITLE: "${EVENT_TITLE:-Pixel War ISMIN}"
      SESSION_SECRET: "${SESSION_SECRET:?Definir SESSION_SECRET dans Coolify}"
      # Verrouillage strict : connexion Authentik obligatoire sur HTTP + WebSocket
      REQUIRE_AUTHENTIK: "${REQUIRE_AUTHENTIK:-true}"
      TRUST_AUTHENTIK_HEADERS: "${TRUST_AUTHENTIK_HEADERS:-true}"
      AUTHENTIK_LOGIN_URL: "${AUTHENTIK_LOGIN_URL:-https://auth.minitel.dev/if/user/}"
      # Seuls les groupes / utilisateurs ci-dessous (+ ceux ajoutés dans l'onglet Admins) sont admins
      AUTHENTIK_ADMIN_GROUPS: "${AUTHENTIK_ADMIN_GROUPS:-admins-infra}"
      ADMIN_USERS: "${ADMIN_USERS:-}"
      # Laisser VIDE pour désactiver le login par mot de passe (recommandé avec Authentik)
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      CANVAS_WIDTH: "${CANVAS_WIDTH:-128}"
      CANVAS_HEIGHT: "${CANVAS_HEIGHT:-128}"
      COOLDOWN_MS: "${COOLDOWN_MS:-5000}"
      MAX_CHARGES: "${MAX_CHARGES:-1}"
      COOLDOWN_MODE: "${COOLDOWN_MODE:-authentik}"
      AUTO_SNAPSHOT_MINUTES: "${AUTO_SNAPSHOT_MINUTES:-15}"
      MAX_AUTO_SNAPSHOTS: "${MAX_AUTO_SNAPSHOTS:-48}"
      LOOTBOX_ENABLED: "${LOOTBOX_ENABLED:-true}"
      LOOTBOX_INTERVAL_MINUTES: "${LOOTBOX_INTERVAL_MINUTES:-60}"
    volumes:
      - pixel_war_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  pixel_war_data:
